<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  [hidden]{display:none!important}
  .ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    font:12px/1.4 -apple-system,system-ui,sans-serif;color:rgba(255,255,255,.55);letter-spacing:.04em}
  #toggle{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));background:none;border:0;
    color:rgba(255,255,255,.45);font:12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;padding:8px}
  .panel{display:grid;grid-template-columns:72px 1fr 40px;gap:6px 10px;align-items:center;
    background:rgba(0,0,0,.55);padding:10px 4px 4px;border-radius:8px}
  .panel input{width:100%;accent-color:#9cf}
  .panel span:last-child{text-align:right}
  #hint{position:fixed;left:0;right:0;top:62%;text-align:center;padding:0 24px;pointer-events:none;
    color:rgba(255,255,255,.6);font:14px/1.6 -apple-system,system-ui,sans-serif;letter-spacing:.04em;transition:opacity .8s}
  #meter{position:fixed;left:50%;bottom:calc(4px + env(safe-area-inset-bottom));height:2px;width:0;
    transform:translateX(-50%);background:rgba(255,255,255,.35);border-radius:1px;pointer-events:none}
  #micinfo{grid-column:1 / -1;color:rgba(255,255,255,.45)}
  #err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
    color:#fff;font:14px/1.6 system-ui;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle">TUNE</button>
<div class="ui" id="ui" hidden>
  <div class="panel" id="panel"></div>
</div>
<div id="hint"></div>
<div id="meter"></div>
<div id="err" hidden></div>
<script src="env-borghese-v1.js"></script>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const fixedT = params.has('t') ? parseFloat(params.get('t')) : null; // ?t=秒 で時刻を固定（スクショ用）

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, alpha:false, premultipliedAlpha:false});
if (!gl) {
  const e = document.getElementById('err'); e.hidden = false;
  e.textContent = 'WebGL2 is not available on this browser.';
  throw new Error('no webgl2');
}

// ---------------- 調整できる値 ----------------
const tune = {
  thick:   {label:'Thickness', min:0.5, max:2.5, step:0.01, v:1.0},   // 膜厚の全体倍率
  flow:    {label:'Flow',      min:0.0, max:3.0, step:0.01, v:1.0},   // 膜の流れの速さ
  light:   {label:'Light',     min:0.2, max:3.0, step:0.01, v:0.6},   // 照明の強さ
  fill:    {label:'Fill',      min:0.0, max:3.0, step:0.01, v:1.0},   // スタジオ: 周りの淡い光
  center:  {label:'Center',    min:0.0, max:3.0, step:0.01, v:0.15},  // 屋外: 正面の映り込みの強さ
  edge:    {label:'Edge',      min:0.5, max:6.0, step:0.01, v:3.0},   // 屋外: 縁の映り込みの強さ
  contrast:{label:'Contrast',  min:1.0, max:3.0, step:0.01, v:1.2},   // 屋外: 景色のコントラスト（ガンマ）
  pivot:   {label:'Bright',    min:-3.0, max:3.0, step:0.01, v:0.0},  // 屋外: 景色の明るさ（段数）
  turn:    {label:'Turn',      min:0.0, max:6.28, step:0.01, v:3.14}, // 屋外: 景色の向き
  size:    {label:'Size',      min:0.4, max:1.4, step:0.01, v:1.0},   // 玉の大きさの倍率
  sens:    {label:'Mic sens',  min:4.0, max:30.0, step:0.5, v:12.0},  // 息と判定する大きさ（周りの音より何dB大きいか）。小さいほど敏感
  span:    {label:'Mic range', min:10.0, max:50.0, step:0.5, v:28.0}, // 弱い息〜最強の息の幅（dB）
};
// ?thick=1.5 のように URL で初期値を変えられる（見比べ用）
for (const [k, o] of Object.entries(tune)) {
  const x = parseFloat(params.get(k));
  if (Number.isFinite(x)) o.v = Math.min(o.max, Math.max(o.min, x));
}
const panel = document.getElementById('panel');
for (const [k, o] of Object.entries(tune)) {
  const l = document.createElement('span'); l.textContent = o.label;
  const r = document.createElement('input'); r.type = 'range';
  Object.assign(r, {min:o.min, max:o.max, step:o.step, value:o.v});
  const n = document.createElement('span'); n.textContent = o.v.toFixed(2);
  r.addEventListener('input', () => { o.v = parseFloat(r.value); n.textContent = o.v.toFixed(2); });
  panel.append(l, r, n);
}
// 映り込み: 青空（屋外）かスタジオか。?env=studio で最初からスタジオ
let envSky = params.get('env') !== 'studio';
{
  const l = document.createElement('span'); l.textContent = 'Reflect';
  const b = document.createElement('button');
  b.style.cssText = 'grid-column:span 2;justify-self:start;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:4px 10px;font:inherit';
  const show = () => { b.textContent = envSky ? 'Sky (outdoor)' : 'Studio'; };
  b.addEventListener('click', () => { envSky = !envSky; show(); });
  show(); panel.append(l, b);
}
const ui = document.getElementById('ui');
document.getElementById('toggle').addEventListener('click', () => { ui.hidden = !ui.hidden; });

// ---------------- 波長→RGB の重み（CIE 1931 の近似、Wyman ほか 2013） ----------------
const NL = 16;
function g(x, mu, s1, s2) { const s = x < mu ? s1 : s2; const t = (x - mu) / s; return Math.exp(-0.5 * t * t); }
const lambdas = [], weights = [];
{
  const sum = [0,0,0];
  for (let i = 0; i < NL; i++) {
    const l = 400 + (300 * (i + 0.5)) / NL;
    const X = 1.056*g(l,599.8,37.9,31.0) + 0.362*g(l,442.0,16.0,26.7) - 0.065*g(l,501.1,20.4,26.2);
    const Y = 0.821*g(l,568.8,46.9,40.5) + 0.286*g(l,530.9,16.3,31.1);
    const Z = 1.217*g(l,437.0,11.8,36.0) + 0.681*g(l,459.0,26.0,13.8);
    const r =  3.2406*X - 1.5372*Y - 0.4986*Z;
    const gg = -0.9689*X + 1.8758*Y + 0.0415*Z;
    const b =  0.0557*X - 0.2040*Y + 1.0570*Z;
    lambdas.push(l); weights.push(r, gg, b);
    sum[0] += r; sum[1] += gg; sum[2] += b;
  }
  // 反射率が全波長で同じなら白（1,1,1）になるように正規化
  for (let i = 0; i < NL; i++) for (let c = 0; c < 3; c++) weights[i*3+c] /= sum[c];
}

// ---------------- シェーダー ----------------
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;

const MAXB = 8;
const fs = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;
uniform float uTime, uThick, uFlow, uLight, uFill, uYaw, uPitch, uSky, uEnvYaw, uCenterGain, uEdgeGain, uContrast, uPivot;
uniform sampler2D uEnv;
#define MAXB 8
uniform int uN;               // 玉の数
uniform vec3 uBC[MAXB];       // 玉の中心
uniform vec3 uBA[MAXB];       // 楕円体の半径（ゆがみ込み）
uniform float uBS[MAXB];      // 玉ごとの種（膜の模様をずらす）
uniform float uLambda[${NL}];
uniform vec3 uW[${NL}];

// ---- 3D simplex noise (Ashima / Stefan Gustavson, MIT) ----
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+10.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.5-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 105.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s, 0.,1.,0., s,0.,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0., 0.,c,s, 0.,-s,c);}

// ---- 膜厚（nm）: 上ほど薄く（重力で下へ排液）、渦を巻きながら下へ流れる ----
float filmThickness(vec3 p, float seed){
  float t = uTime * uFlow + seed * 37.0;
  float h = p.y;
  // 高さごとにずれて回る（緯度ごとの差回転）→ 縞が引き伸ばされて渦になる
  float ang = 0.35*t + 0.9*sin(0.23*t + 2.2*h) + 0.5*sin(0.13*t - 3.1*h);
  vec3 q = rotY(ang) * p + vec3(seed*7.3, 0.0, seed*3.1);
  // 流れを曲げる（ドメインワープ）
  vec3 w = vec3(snoise(q*0.8 + vec3(0.0, 0.08*t, 0.0)),
                snoise(q*0.8 + vec3(5.2, 1.3 + 0.08*t, 2.1)),
                snoise(q*0.8 + vec3(1.7, 9.2 + 0.08*t, 4.4)));
  vec3 r = q*1.05 + 1.1*w + vec3(0.0, 0.22*t, 0.0);   // y に時間を足す → 模様は下へ流れる
  float n = 0.8*snoise(r) + 0.2*snoise(r*2.4 + 7.1);
  // 膜はほぼ一様（約260nm）。色の変化は主に見る角度で出る → 中心から縁へ 青→マゼンタ→橙→黄 のグラデーション
  // 排液でわずかに上が薄く、流れの模様はうっすら
  float base = mix(305.0, 255.0, smoothstep(-1.0, 1.0, h));
  float d = base * (1.0 + 0.07*n);
  // 細い筋（下から上がってくる薄い膜の羽根＝縁再生）
  float plume = smoothstep(0.55, 0.95, snoise(vec3(q.x*6.0, q.y*1.2 - 0.5*t, q.z*6.0)));
  d *= 1.0 - 0.06*plume*smoothstep(0.6, -0.6, h);
  // 頂上付近はさらに薄くなり、黒い膜（ほぼ反射しない）が点々と出る
  float top = smoothstep(0.55, 1.0, h);
  float spots = smoothstep(0.45, 0.8, snoise(q*3.5 + vec3(0.0, 0.2*t, 0.0)));
  d = mix(d, 15.0, top*spots*0.3);
  return max(d, 5.0) * uThick;
}

// ---- 薄膜干渉の反射率（波長ごとに Airy の式、s/p 偏光の平均）→ RGB ----
vec3 filmReflect(float d, float cosi){
  const float n = 1.34;
  float sini2 = 1.0 - cosi*cosi;
  float cost = sqrt(max(1.0 - sini2/(n*n), 0.0));
  float rs = (cosi - n*cost)/(cosi + n*cost);
  float rp = (n*cosi - cost)/(n*cosi + cost);
  float rs2 = rs*rs, rp2 = rp*rp;
  vec3 acc = vec3(0.0);
  float opd = 4.0*3.14159265*n*d*cost;       // 位相差 = opd / λ
  // 厚くなるほど干渉が薄まる（光のコヒーレンス・波長幅のぼけ）
  float coh = exp(-pow(d*cost/2600.0, 2.0));
  for (int i = 0; i < ${NL}; i++){
    float c = cos(opd / uLambda[i]) * coh;
    // 膜の上下で反射係数の符号が逆（r2 = -r1）
    float Rs = 2.0*rs2*(1.0 - c) / (1.0 + rs2*rs2 - 2.0*rs2*c);
    float Rp = 2.0*rp2*(1.0 - c) / (1.0 + rp2*rp2 - 2.0*rp2*c);
    acc += uW[i] * (0.5*(Rs + Rp));
  }
  return max(acc, 0.0);
}

// ---- 架空のスタジオ: 黒い部屋に細長いソフトボックス、窓、天井の大きな面光源 ----
float rectLight(vec3 ro, vec3 rd, vec3 c, vec3 nrm, vec3 u, vec2 hs, float soft){
  float dn = dot(rd, nrm);
  if (dn >= 0.0) return 0.0;               // nrm は光の面の表（球の方を向く）
  float t = dot(c - ro, nrm) / dn;
  if (t <= 0.0) return 0.0;
  vec3 p = ro + rd*t - c;
  vec3 v = cross(nrm, u);
  vec2 a = abs(vec2(dot(p,u), dot(p,v))) / hs;
  // 角を少し丸めた四角＋周りの淡いにじみ
  vec2 q = max(a - (1.0 - soft), 0.0) / soft;
  float e = length(q);
  float core = 1.0 - smoothstep(0.75, 1.0, e);
  float halo = exp(-3.0*max(e - 1.0, 0.0)) * 0.04;
  return core + halo;
}
vec3 face(vec3 pos){ return normalize(-pos); }   // 原点（玉）の方を向く
float windowLight(vec3 ro, vec3 rd, vec3 c, vec3 nrm, vec3 u, vec2 hs){
  float dn = dot(rd, nrm);
  if (dn >= 0.0) return 0.0;
  float t = dot(c - ro, nrm) / dn;
  if (t <= 0.0) return 0.0;
  vec3 p = ro + rd*t - c;
  vec3 v = cross(nrm, u);
  vec2 a = vec2(dot(p,u), dot(p,v)) / hs;
  if (max(abs(a.x), abs(a.y)) > 1.0) return 0.0;
  // 窓の桟（十字＋縦の分割）
  vec2 g = abs(fract(a*vec2(1.0, 1.0)*0.5 + 0.5) - 0.5);
  float bar = step(0.035, min(g.x, g.y)) * step(0.035, abs(a.x)) ;
  float edge = 1.0 - smoothstep(0.92, 1.0, max(abs(a.x), abs(a.y)));
  return bar * edge * (0.75 + 0.25*a.y);
}
vec3 studio(vec3 ro, vec3 rd){
  mat3 R = rotY(-uYaw) * rotX(-uPitch);
  ro = R*ro; rd = R*rd;
  vec3 L = vec3(0.0);
  // 左手前の縦長ソフトボックス（メインの光）
  vec3 c1 = vec3(-3.2, 0.4, 3.0);
  L += vec3(1.0, 0.98, 0.95) * 30.0 * rectLight(ro, rd, c1, face(c1), normalize(cross(vec3(0,1,0), face(c1))), vec2(0.45, 2.6), 0.25);
  // 右奥の細いストリップ（縁を照らす）
  vec3 c2 = vec3(3.6, -0.2, -1.2);
  L += vec3(0.95, 0.97, 1.0) * 16.0 * rectLight(ro, rd, c2, face(c2), normalize(cross(vec3(0,1,0), face(c2))), vec2(0.22, 3.0), 0.3);
  // 右上手前の窓
  vec3 c3 = vec3(2.4, 2.0, 3.4);
  vec3 n3 = face(c3);
  L += vec3(1.0) * 22.0 * windowLight(ro, rd, c3, n3, normalize(cross(vec3(0,1,0), n3)), vec2(0.9, 0.9));
  // 天井の大きな面光源（弱め）
  vec3 c4 = vec3(0.0, 4.5, 0.5);
  L += vec3(1.0, 0.99, 0.97) * 4.0 * rectLight(ro, rd, c4, vec3(0,-1,0), vec3(1,0,0), vec2(2.4, 1.6), 0.5);
  L *= uLight;
  // 部屋の淡い明るさ（縁の虹色を浮かせる）。手前（カメラ側）は暗く、横・奥・下は少し明るい
  // 玉の奥側（rd.z<0）は少し明るい壁、カメラ側は暗い。奥向きの反射は縁でしか起きないので、縁だけが光る
  float back = smoothstep(0.1, -0.7, rd.z);
  vec3 fill = vec3(0.5, 0.52, 0.56) * (0.01 + 0.3*back + 0.06*max(-rd.y, 0.0)*back);
  L += fill * uFill;
  return L;
}

// ---- 屋外の HDRI（Borghese Gardens, Poly Haven CC0）。正距円筒図法、各色 log2 で 8bit に詰めてある ----
vec3 sky(vec3 rd){
  mat3 R = rotY(-uYaw - uEnvYaw) * rotX(-uPitch);
  rd = normalize(R*rd);
  vec2 uv = vec2(0.5 + atan(rd.x, -rd.z + 1e-6) * 0.15915494, acos(clamp(rd.y, -1.0, 1.0)) * 0.31830989);
  vec3 v = texture(uEnv, uv).rgb;
  // コントラスト: 明るさの対数（中央値=0）に倍率を掛ける＝ガンマ。暗い所はより沈み、明るい所はより上がる
  float l2 = v.r*0.2126 + v.g*0.7152 + v.b*0.0722;          // 明るさ（対数のまま）
  vec3 lg = v*24.0 - 12.0;
  float L = l2*24.0 - 12.0;
  lg += L * (uContrast - 1.0) + uPivot;                       // 色みは保ったまま明るさだけ伸ばす
  return exp2(lg) * uLight;
}
vec3 env(vec3 ro, vec3 rd){ return uSky > 0.5 ? sky(rd) : studio(ro, rd); }

// ---- 楕円体との交差（入りと出の2点） ----
bool hitEllipsoid(vec3 ro, vec3 rd, vec3 c, vec3 ax, out float t0, out float t1){
  vec3 o = (ro - c)/ax, d = rd/ax;
  float A = dot(d,d), B = dot(o,d), C = dot(o,o) - 1.0;
  float D = B*B - A*C;
  if (D < 0.0) return false;
  D = sqrt(D);
  t0 = (-B - D)/A; t1 = (-B + D)/A;
  return t1 > 0.0;
}
vec3 ellNormal(vec3 p, vec3 c, vec3 ax){ return normalize((p - c)/(ax*ax)); }

// 物理の反射率に掛ける倍率。正面（cos=1）は uCenterGain、縁（cos→0）ほど uEdgeGain に近づく
float gain(float c){ return uSky > 0.5 ? mix(uCenterGain, uEdgeGain, pow(1.0 - c, 1.5)) : 1.0; }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }

vec3 shadeBubble(vec3 ro, vec3 rd, vec3 c, vec3 ax, float seed){
  vec3 col = vec3(0.0);
  float t0, t1;
  if (hitEllipsoid(ro, rd, c, ax, t0, t1)) {
    // 手前の膜（外側からの反射）
    vec3 p0 = ro + rd*t0;
    vec3 n0 = ellNormal(p0, c, ax);
    float c0 = clamp(dot(-rd, n0), 0.0, 1.0);
    vec3 R0 = filmReflect(filmThickness((p0 - c)/ax, seed), c0);
    col += R0 * gain(c0) * env(p0 - c, reflect(rd, n0));
    // 奥の膜（内側からの反射。手前の膜を通り抜けた光）→ 小さく反転した映り込み
    vec3 p1 = ro + rd*t1;
    vec3 n1 = ellNormal(p1, c, ax);
    float c1 = clamp(dot(rd, n1), 0.0, 1.0);
    vec3 R1 = filmReflect(filmThickness((p1 - c)/ax, seed), c1);
    vec3 T0 = 1.0 - R0;
    col += T0 * R1 * gain(c1) * env(p1 - c, reflect(rd, -n1)) * 0.9;
  }
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / min(uRes.x, uRes.y);
  vec3 ro = vec3(0.0, 0.0, 7.0);
  vec3 rd = normalize(vec3(uv, -2.2));
  vec3 col = vec3(0.0);
  // 重なった玉は反射を足し合わせる（膜の透過率はほぼ1なので順番はほとんど効かない）
  for (int i = 0; i < MAXB; i++){
    if (i >= uN) break;
    col += shadeBubble(ro, rd, uBC[i], uBA[i], uBS[i]);
  }
  col = aces(col * 1.1);
  col = pow(col, vec3(1.0/2.2));
  // ごく弱いフィルムノイズ（帯状のムラを消す）
  float nz = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898,78.233)) + uTime) * 43758.5453);
  col += (nz - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog;
try {
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
} catch (e) {
  const el = document.getElementById('err'); el.hidden = false; el.textContent = 'Shader error: ' + e.message;
  throw e;
}
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
for (const n of ['uRes','uTime','uThick','uFlow','uLight','uFill','uYaw','uPitch','uSky','uEnvYaw','uCenterGain','uEdgeGain','uContrast','uPivot','uEnv','uN','uBC','uBA','uBS','uLambda','uW'])
  U[n] = gl.getUniformLocation(prog, n);
gl.uniform1fv(U.uLambda, new Float32Array(lambdas));
gl.uniform3fv(U.uW, new Float32Array(weights));

// ---------------- HDRI テクスチャ（env-borghese-v1.js の data URL） ----------------
let envReady = false;
{
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U.uEnv, 0);
  if (window.ENV_PNG) {
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);   // 色の自動変換で log の値がずれないように
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      envReady = true;
    };
    img.onerror = () => { envSky = false; };   // 読めなければスタジオ表示に
    img.src = window.ENV_PNG;
  }
}

// ---------------- 画面サイズ（スマホは画素を抑えて軽く） ----------------
// 重い端末では描画の解像度を自動で下げる（2 → 1.5 → 1）
let dprCap = 2, slowFrames = 0, lastNow = 0;
function watchSpeed(now) {
  if (lastNow) {
    const dt = now - lastNow;
    if (dt > 24 && dt < 200) slowFrames++; else slowFrames = Math.max(0, slowFrames - 1);
    if (slowFrames > 40 && dprCap > 1) { dprCap = dprCap > 1.5 ? 1.5 : 1; slowFrames = 0; }
  }
  lastNow = now;
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}
window.addEventListener('resize', resize);

// ---------------- モード ----------------
// ?single=1 … 以前の「1個を眺める」表示（見た目の調整用）
// ?demo=1   … マイクの代わりに決まった吹き方を繰り返す（確認・スクショ用）
// ?warm=6   … 最初に 6 秒ぶん動かしてから表示（スクショ用）。?seed=数字 で乱数を固定
const single = params.has('single');
const demo = params.has('demo');
const warm = Math.max(0, Math.min(30, parseFloat(params.get('warm')) || 0));
let seed = parseInt(params.get('seed'), 10);
if (!Number.isFinite(seed)) seed = (Math.random() * 1e9) | 0;
function rand() {   // mulberry32
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };

// ---------------- 表示文字 ----------------
const hintEl = document.getElementById('hint'), meterEl = document.getElementById('meter');
let hintTimer = 0;
function setHint(text, ms) {
  clearTimeout(hintTimer);
  hintEl.textContent = text; hintEl.style.opacity = 1;
  if (ms) hintTimer = setTimeout(() => { hintEl.style.opacity = 0; }, ms);
}
if (single || demo) hintEl.hidden = true;
else setHint('画面をタップしてマイクをオンに');
if (single) meterEl.hidden = true;
const micInfo = document.createElement('span'); micInfo.id = 'micinfo';
if (!single) panel.append(micInfo);

// ---------------- マイク（息の検出） ----------------
// 息は 1〜6kHz に広がる雑音。周りの音の大きさ（ゆっくり追う下限）より何 dB 大きいかで強さを決める
let mic = null, micBusy = false, micS = 0;
async function startMic() {
  if (mic || micBusy) return;
  micBusy = true;
  setHint('マイクを準備しています…');
  let ac, stream;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();   // タップの中で作る（iPhone の制約）
    ac.resume().catch(() => {});
    stream = await navigator.mediaDevices.getUserMedia({audio: {
      echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1}});
    await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    const an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0;
    src.connect(an);
    const hz = ac.sampleRate / an.fftSize;
    mic = {ac, an, fd: new Float32Array(an.frequencyBinCount),
      lo: Math.floor(1000 / hz), hi: Math.min(an.frequencyBinCount, Math.floor(6000 / hz)),
      floor: null, t: 0, on: false, excess: 0};
    setHint('画面の下（マイク）に向かって息を吹いて', 5000);
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ac) ac.close();
    setHint('マイクが使えません（' + e.name + '）。もう一度タップで再試行');
  } finally { micBusy = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && mic) mic.ac.resume(); });
function readMic(dt) {
  const m = mic;
  m.an.getFloatFrequencyData(m.fd);
  let e = 0;
  for (let i = m.lo; i < m.hi; i++) e += Math.pow(10, m.fd[i] / 10);
  const db = 10 * Math.log10(e / (m.hi - m.lo) + 1e-12);
  m.t += dt;
  // 立ち上がり直後の無音（-100dB 未満）は周りの音の基準にしない。最初の 0.5 秒は判定しない
  if (m.floor === null) { if (db < -100) return; m.floor = db; }
  // 周りの音: 下がるのは速く、上がるのはゆっくり（息の最中に追いつかないように）。最初の 0.5 秒は素早く合わせる
  const up = m.t < 0.5 ? 3 : 0.03;
  m.floor += (db - m.floor) * Math.min(1, dt * (db < m.floor ? 3 : up));
  m.excess = db - m.floor;
  const sens = tune.sens.v;
  m.on = m.t < 0.5 ? false : m.on ? m.excess > sens - 4 : m.excess > sens;            // 入り切りにすき間（ちらつき防止）
  const raw = m.on ? lerp(0.05, 1, clamp01((m.excess - sens + 4) / tune.span.v)) : 0;
  micS += (raw - micS) * Math.min(1, dt * (raw > micS ? 14 : 5));
}

// キーボード（PC で確認用）: 1=弱く長く 2=中くらい 3=強く 押している間だけ吹く
const keyLevel = {'1': 0.15, '2': 0.5, '3': 0.9};
let keyS = 0;
addEventListener('keydown', e => { if (keyLevel[e.key]) keyS = keyLevel[e.key]; });
addEventListener('keyup', e => { if (keyLevel[e.key]) keyS = 0; });
// デモの吹き方（14 秒で一巡）: 弱く長く → 中くらい → 強く短く
function demoBreath(t) {
  const u = t % 14;
  return u < 3 ? 0.15 : u < 5 ? 0 : u < 7 ? 0.5 : u < 9 ? 0 : u < 10 ? 0.9 : 0;
}

// ---------------- シャボン玉の動き ----------------
// カメラは z=7 から -z を見る。奥行き z の位置で画面の端がどこにあるか
function viewHalf(z) {
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1, m = Math.min(w, h);
  const k = 0.5 * (7 - z) / 2.2;
  return [k * w / m, k * h / m];
}
const bubbles = [];
let grower = null;      // いま膨らんでいる玉（画面の下端にくっついている）
let breath = 0, simT = 0;

function spawn() {
  // 古い玉から消して上限を守る（割れ方は後の段階で作る。今はすっと縮んで消える）
  if (bubbles.length >= MAXB) {
    const i = bubbles.findIndex(b => b.state === 'gone');
    const j = i >= 0 ? i : bubbles.findIndex(b => b.state === 'free');
    if (j < 0) return null;
    bubbles.splice(j, 1);
  }
  if (bubbles.filter(b => b.state !== 'gone').length >= MAXB - 1) {
    const old = bubbles.find(b => b.state === 'free');
    if (old) old.state = 'gone';
  }
  const z = lerp(-0.8, 0.3, rand());
  const [hx] = viewHalf(z);
  const b = {state: 'grow', x: lerp(-0.4, 0.4, rand()) * hx, y: 0, z, vx: 0, vy: 0, vz: 0,
    r: 0.04, sAvg: breath, age: 0, wt: 0, seed: rand(), ax: [0, 0, 0],
    A: 0, B: lerp(0.04, 0.1, rand()), ph: rand() * 6.28, w: 6, k: 1.8};
  bubbles.push(b);
  return b;
}
function release(b, s) {
  b.state = 'free';
  b.vy = 0.8 + 3.0 * s;                       // 強く吹くほど勢いよく飛ぶ
  b.vx = lerp(-0.5, 0.5, rand()) * (0.3 + s); // 強いほど左右に散る
  b.vz = lerp(-0.2, 0.1, rand());
  b.A = 0.15 + 0.2 * s;                       // 離れた直後の縦の伸び → 震えながら丸に戻る
  b.w = 5.0 / Math.sqrt(Math.max(b.r, 0.15)); // 小さい玉ほど速く震える
  b.wt = 0;
}
function updateBubbles(dt, s) {
  // 吹いている間: 下端で玉が膨らむ。弱く長く＝大きく育つ／強く＝すぐ離れて小さい玉が次々
  if (s > 0.02) {
    if (!grower) grower = spawn();
    if (grower) {
      const g = grower;
      g.sAvg += (s - g.sAvg) * Math.min(1, dt * 3);
      const rMax = lerp(0.95, 0.28, smooth(0.1, 0.85, g.sAvg)) * tune.size.v;
      g.r += (0.25 + 1.6 * s) * dt;
      g.age += dt;
      if (g.r >= rMax) { g.r = rMax; release(g, s); grower = null; }
    }
  } else if (grower) {
    // 息が止まった: ある程度育っていれば離れて飛ぶ、小さすぎればしぼんで消える
    if (grower.r > 0.12) release(grower, Math.max(grower.sAvg, 0.1)); else grower.state = 'gone';
    grower = null;
  }

  for (const b of bubbles) {
    const [hx, hy] = viewHalf(b.z);
    if (b.state === 'grow') {
      // 下端に半分埋まった状態から膨らむ。息で縦に伸び、細かく震える
      b.x += Math.sin(b.age * 7 + b.seed * 9) * 0.02 * s * dt * 10;
      b.y = -hy + b.r * 0.7;
      const e = 0.15 + 0.2 * s, j = 0.03 * Math.sin(b.age * 23);
      b.ax = [b.r * (1 - 0.4 * e + j), b.r * (1 + e - j), b.r * (1 - 0.4 * e + j)];
      continue;
    }
    if (b.state === 'gone') {
      b.r *= Math.exp(-12 * dt);
      b.ax = b.ax.map(v => v * Math.exp(-12 * dt));
      continue;
    }
    b.wt += dt;
    // 気流（ゆっくりした揺れ）、わずかな重さでゆっくり沈む、下の方は息に押し上げられる
    const T = simT;
    const fx = 0.25 * Math.sin(T * 0.7 + b.seed * 10) + 0.15 * Math.sin(T * 1.3 + b.seed * 3);
    const fy = 0.12 * Math.sin(T * 0.5 + b.seed * 7) - 0.12
      + s * 2.5 * Math.exp(-Math.max(0, b.y + hy) / 1.5);
    b.vx += fx * dt; b.vy += fy * dt;
    const drag = Math.exp(-1.2 * dt);
    b.vx *= drag; b.vy *= drag; b.vz *= drag;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z = Math.max(-1.5, Math.min(0.6, b.z + b.vz * dt));
    // 震え: 縦横に伸び縮み（体積はほぼ一定）しながら弱まる
    const d = Math.exp(-b.k * b.wt);
    const m1 = b.A * Math.cos(b.w * b.wt) * d + 0.012 * Math.sin(T * 1.7 + b.seed * 9);
    const m2 = b.B * Math.sin(b.w * 1.37 * b.wt + b.ph) * d + 0.01 * Math.sin(T * 2.3 + b.seed * 5);
    const fyS = 1 + m1, q = 1 / Math.sqrt(fyS);
    b.ax = [b.r * (1 + m2) * q, b.r * fyS, b.r * (1 - m2) * q];
    // 画面の外へ出たら消す
    if (b.y - b.r > hy + 0.3 || b.y + b.r < -hy - 0.6 || Math.abs(b.x) - b.r > hx + 0.3) b.state = 'out';
  }
  // 玉どうしは重ならないよう押し合う（くっついて面が平らになるのは「複数個」の段階で作る）
  for (let i = 0; i < bubbles.length; i++) for (let j = i + 1; j < bubbles.length; j++) {
    const a = bubbles[i], b = bubbles[j];
    if (a.state === 'gone' || b.state === 'gone') continue;
    const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
    const d = Math.hypot(dx, dy, dz) || 1e-4, minD = (a.r + b.r) * 0.97;
    if (d >= minD) continue;
    const nx = dx / d, ny = dy / d, nz = dz / d;
    const wa = a.state === 'grow' ? 0 : 1, wb = b.state === 'grow' ? 0 : 1;   // 膨らみ中の玉は動かさない
    if (wa + wb === 0) continue;
    const push = (minD - d) * Math.min(1, dt * 8) / (wa + wb);
    a.x -= nx * push * wa; a.y -= ny * push * wa; a.z -= nz * push * wa;
    b.x += nx * push * wb; b.y += ny * push * wb; b.z += nz * push * wb;
    // 近づく向きの速さを消す
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny + (b.vz - a.vz) * nz;
    if (rv < 0) {
      const k = rv / (wa + wb);
      a.vx += nx * k * wa; a.vy += ny * k * wa; a.vz += nz * k * wa;
      b.vx -= nx * k * wb; b.vy -= ny * k * wb; b.vz -= nz * k * wb;
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.state === 'out' || (b.state === 'gone' && b.r < 0.01)) bubbles.splice(i, 1);
  }
}

// 以前の 1 個表示（?single=1）
function singleBubble(t) {
  const cx = 0.10*Math.sin(t*0.21) + 0.05*Math.sin(t*0.53 + 1.0);
  const cy = 0.08*Math.sin(t*0.17 + 0.5) + 0.03*Math.sin(t*0.61);
  const a = 0.012*Math.sin(t*1.7) + 0.007*Math.sin(t*2.9 + 1.3);
  const b = 0.010*Math.sin(t*2.3 + 0.7);
  const r = tune.size.v;
  return [{x: cx, y: cy, z: 0, seed: 0, ax: [r*(1 + a), r*(1 - a + b), r*(1 - b)]}];
}

function step(dt) {
  simT += dt;
  breath = demo ? demoBreath(simT) : Math.max(keyS, micS);
  updateBubbles(dt, breath);
}

// ---------------- ドラッグで映り込みを回す／最初のタップでマイクをオン ----------------
let yaw = 0, pitch = 0, tYaw = 0, tPitch = 0, drag = null;
// マイクは click（指を離したとき）で開く。iPhone ではタッチの押し始めはユーザー操作として扱われないため
canvas.addEventListener('click', () => { if (!single && !demo && !mic) startMic(); });
canvas.addEventListener('pointerdown', e => {
  drag = {x:e.clientX, y:e.clientY, yaw:tYaw, pitch:tPitch}; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const s = 3.0 / Math.min(innerWidth, innerHeight);
  tYaw = drag.yaw + (e.clientX - drag.x) * s;
  tPitch = Math.max(-0.8, Math.min(0.8, drag.pitch + (e.clientY - drag.y) * s));
});
const end = () => { drag = null; };
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

// ---------------- 描画ループ ----------------
const bc = new Float32Array(MAXB * 3), ba = new Float32Array(MAXB * 3), bs = new Float32Array(MAXB);
if (!single) for (let i = 0; i < warm * 60; i++) step(1 / 60);
let lastFrame = 0;
function frame(now) {
  watchSpeed(now);
  resize();
  const dt = lastFrame ? Math.min((now - lastFrame) / 1000, 1 / 20) : 1 / 60;
  lastFrame = now;
  let list;
  if (single) {
    simT = fixedT !== null ? fixedT : simT + dt;
    list = singleBubble(simT);
  } else {
    if (mic) readMic(dt);
    step(dt);
    list = bubbles;
    meterEl.style.width = (breath * 50).toFixed(1) + 'vw';
    if (!ui.hidden) micInfo.textContent = mic
      ? '息の大きさ ' + mic.excess.toFixed(1) + ' dB（' + tune.sens.v.toFixed(1) + ' dB 以上で吹いた判定）'
      : 'マイク未接続（PC はキー 1/2/3 で吹ける）';
  }
  const n = Math.min(list.length, MAXB);
  for (let i = 0; i < n; i++) {
    const b = list[i];
    bc.set([b.x, b.y, b.z], i * 3); ba.set(b.ax, i * 3); bs[i] = b.seed;
  }
  yaw += (tYaw - yaw) * 0.12; pitch += (tPitch - pitch) * 0.12;
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, simT);
  gl.uniform1f(U.uThick, tune.thick.v);
  gl.uniform1f(U.uFlow, tune.flow.v);
  gl.uniform1f(U.uLight, tune.light.v);
  gl.uniform1f(U.uFill, tune.fill.v);
  gl.uniform1f(U.uYaw, yaw);
  gl.uniform1f(U.uPitch, pitch);
  gl.uniform1f(U.uSky, envSky && envReady ? 1 : 0);
  gl.uniform1f(U.uEnvYaw, tune.turn.v);
  gl.uniform1f(U.uCenterGain, tune.center.v);
  gl.uniform1f(U.uEdgeGain, tune.edge.v);
  gl.uniform1f(U.uContrast, tune.contrast.v);
  gl.uniform1f(U.uPivot, tune.pivot.v);
  gl.uniform1i(U.uN, n);
  gl.uniform3fv(U.uBC, bc);
  gl.uniform3fv(U.uBA, ba);
  gl.uniform1fv(U.uBS, bs);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
